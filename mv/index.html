<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MV 작업실</title><link rel="stylesheet" href="../workroom.css"><body><main><a href="../">← 작업실 선택</a><p>WORKROOM 01</p><h1>노래 × 가사 MV</h1><div class="bar"><span class="auth">등록한 아이디와 비밀번호로 로그인하세요.</span><button class="login">로그인</button></div><section class="studio" data-room="mv"><label>노래 파일<input class="song" type="file" accept="audio/*"></label><label>가사 전체<textarea class="lyrics" placeholder="가사를 붙여 넣으세요."></textarea></label><label>캐릭터 시트 (선택)<input class="image" type="file" accept="image/*"></label><label>캐릭터 설명<textarea class="characterDescription" placeholder="캐릭터 외형·의상·성격을 설명하세요."></textarea></label><label>해상도<select class="resolution"><option>720p</option><option>480p</option><option>1080p</option></select></label><fieldset><legend>생성 화면비 (같은 장면 구성)</legend><label><input class="ratio16" type="checkbox" checked> 가로 16:9</label><label><input class="ratio9" type="checkbox"> 세로 9:16</label></fieldset><button class="generate">노래·가사로 MV 자동 생성</button><div class="status">선택 화면비마다 같은 8개 장면을 생성합니다.</div><div class="preview"></div></section></main><script type="module" src="../workroom.js"></script>
